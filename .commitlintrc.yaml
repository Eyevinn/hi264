# Conventional Commits headers, checked by the commit-msg hook in
# .pre-commit-config.yaml. Without a configuration file commitlint rejects
# every message. Bodies are often unwrapped paragraphs and subjects may start
# with a Go identifier such as EncodePSkipSliceAt, so those rules are off.
# The types are config-conventional's plus release, used for the
# "release: vX.Y.Z" commits.
extends:
  - "@commitlint/config-conventional"
rules:
  body-max-line-length: [0]
  footer-max-line-length: [0]
  subject-case: [0]
  type-enum:
    - 2
    - always
    - [build, chore, ci, docs, feat, fix, perf, refactor, release, revert, style, test]
